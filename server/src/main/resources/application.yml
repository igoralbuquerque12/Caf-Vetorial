spring:
  application:
    name: ai-copilot

  config:
    import: optional:file:.env[.properties]

  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:copilot}
    username: ${POSTGRES_USER:copilot}
    password: ${POSTGRES_PASSWORD:copilot}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:copilot}
    password: ${RABBITMQ_DEFAULT_PASS:copilot}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 1
        concurrency: 1
        max-concurrency: 3

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: ${JWT_SECRET}
    issuer: ai-copilot
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  aws:
    region: ${AWS_REGION:us-east-1}
    s3-bucket: ${S3_BUCKET}
    s3-endpoint: ${S3_ENDPOINT:}
  messaging:
    document:
      exchange: document.exchange
      routing-key: document.process
      queue: document.process.queue
      dead-letter-exchange: document.dlx
      dead-letter-queue: document.process.dlq
  ingestion:
    chunk-size: 800
    min-chunk-size-chars: 350
  chat:
    system-prompt: classpath:prompts/system-prompt.st
    rag-prompt: classpath:prompts/rag-prompt.st
    top-k: 5
    similarity-threshold: 0.3
